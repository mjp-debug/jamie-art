*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#FAF5FF;font-family:'Inter',sans-serif;color:#2E1065;height:100vh;overflow:hidden;display:flex;flex-direction:column}

.hcount{margin-left:auto;background:rgba(255,255,255,0.18);border-radius:20px;padding:4px 10px;color:#fff;font-size:11px;font-weight:600;white-space:nowrap}

.hbtn:hover{background:#FBBF24}
.hbtn.saved{background:#16a34a;color:#fff}
.apibar{background:#2E1065;padding:7px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #4C1D95;flex-shrink:0}
.apibar span{color:#EDE9FE;font-size:11px;white-space:nowrap}
.apibar input{flex:1;max-width:340px;padding:5px 9px;border-radius:6px;border:1.5px solid #7C3AED;font-size:12px;font-family:'Inter',sans-serif;background:#1a0040;color:#EDE9FE;outline:none}
#apiStatus{font-size:11px;color:#8B5CF6}
.main{display:flex;flex:1;overflow:hidden}
.left{width:250px;flex-shrink:0;background:#fff;border-right:2px solid #EDE9FE;display:flex;flex-direction:column;overflow:hidden}
.ltop{padding:9px;background:#F3E8FF;border-bottom:1px solid #EDE9FE;flex-shrink:0}
.lsearch{width:100%;padding:6px 9px;border:2px solid #DDD6FE;border-radius:7px;font-size:12px;font-family:'Inter',sans-serif;background:#fff;color:#2E1065;outline:none}
.lsearch:focus{border-color:#7C3AED}
.lcount{font-size:10px;color:#7C3AED;margin-top:4px;font-weight:600}
.llist{overflow-y:auto;flex:1}
.litem{display:flex;align-items:center;gap:7px;padding:6px 9px;cursor:pointer;border-bottom:1px solid #F3E8FF;border-left:3px solid transparent}
.litem:hover{background:#F3E8FF}
.litem.active{background:#EDE9FE;border-left-color:#7C3AED}
.lthumb{width:36px;height:36px;border-radius:5px;object-fit:cover;flex-shrink:0;cursor:zoom-in}

.right{flex:1;overflow-y:auto;padding:14px;background:#FAF5FF}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.empty-icon{font-size:48px}
.empty-title{font-size:18px;font-weight:700;color:#7C3AED}
.empty-sub{font-size:12px;color:#8B5CF6;text-align:center}

.ptitle{color:#fff;font-size:14px;font-weight:700;line-height:1.3}
.phandle{color:#EDE9FE;font-size:10px;margin-top:2px}

.genbtn:disabled{background:#ccc;cursor:not-allowed;color:#999}

.spin{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px}
#lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.88);z-index:9999;align-items:center;justify-content:center;cursor:pointer}
#lightbox.open{display:flex}

#lb-close{position:absolute;top:18px;right:24px;color:#fff;font-size:30px;cursor:pointer;font-weight:700}
</style>

<div id="lightbox" onclick="closeLB()"><span id="lb-close">✕</span><img id="lb-img" src="" alt=""></div>
<header>

</header>
<div class="apibar">

</div>
<div class="main">

</div>

const SAVE_KEY = 'jamie_v3';
let store = {};
let current = null;

try { store = JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'); } catch {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(store)); } catch {} }
function gf(title, field) { return store[title]?.[field] || ''; }
function sf(title, field, val) { if (!store[title]) store[title]={}; store[title][field]=val; persist(); }

function isDone(p) { return !!(gf(p.t,'desc') && gf(p.t,'tags') && gf(p.t,'seo_title')); }

function updateStats() {
  const done = PRODUCTS.filter(isDone).length;
  document.getElementById('hcount').textContent = done + ' done / ' + (PRODUCTS.length - done) + ' to go · ' + PRODUCTS.length + ' total';
}

function renderList() {
  const q = (document.getElementById('searchBox').value||'').toLowerCase().trim();
  const list = q ? PRODUCTS.filter(p => p.t.toLowerCase().includes(q)) : PRODUCTS;
  document.getElementById('lcount').textContent = list.length + ' products';
  const container = document.getElementById('llist');
  container.innerHTML = '';
  list.forEach(p => {
    const done = isDone(p);
    const sel = current?.t === p.t;
    const div = document.createElement('div');
    div.className = 'litem' + (sel ? ' active' : '');
    div.onclick = () => openProduct(p);
    if (p.i) {
      const img = document.createElement('img');
      img.className = 'lthumb'; img.src = p.i; img.alt = '';
      img.onclick = e => { e.stopPropagation(); openLB(p.i); };
      const ph = document.createElement('div');
      ph.className = 'lthumb-ph'; ph.textContent = '🎨'; ph.style.display = 'none';
      img.onerror = function(){ this.style.display='none'; ph.style.display='flex'; };
      div.appendChild(img); div.appendChild(ph);
    } else {
      const ph = document.createElement('div');
      ph.className = 'lthumb-ph'; ph.textContent = '🎨';
      div.appendChild(ph);
    }
    const info = document.createElement('div');
    info.innerHTML = '<div class="lname">'+p.t+'</div><span class="'+(done?'ldone':'ltodo')+'">'+(done?'✓ Done':'To Do')+'</span>';
    div.appendChild(info);
    container.appendChild(div);
  });
}

function openProduct(p) {
  current = p;
  renderList();
  const panel = document.getElementById('rightPanel');
  const imgHtml = p.i
    ? '<img class="pimg" src="'+p.i+'" alt="'+p.t+'" style="cursor:zoom-in" onclick="openLB(this.src)" onerror="this.style.display=\'none\'">' 
    : '<div class="pimg-ph">🎨</div>';
  panel.innerHTML =
    '<div class="phead">'+imgHtml+'<div><div class="ptitle">'+p.t+'</div><div class="phandle">'+p.h+'</div></div></div>'+
    '<div class="card">'+
      '<div class="flabel">Category</div>'+
      '<select class="finput" id="catSel" onchange="onCatChange()" style="margin-bottom:8px">'+
        '<option value="">-- Select Category --</option>'+
        '<option value="dogs">🐕 Dogs</option>'+
        '<option value="cats">🐈 Cats</option>'+
        '<option value="flowers">🌸 Flowers</option>'+
        '<option value="animals">🐾 Other Animals</option>'+
        '<option value="other">✨ Other</option>'+
      '</select>'+
      '<div id="subcatWrap" style="display:none">'+
        '<div class="flabel" style="margin-top:6px">Breed / Type</div>'+
        '<select class="finput" id="subcatSel" onchange="onSubcatChange()" style="margin-bottom:8px"><option value="">-- Select --</option></select>'+
        '<input class="finput" id="customInput" type="text" placeholder="Type breed or type..." style="display:none;margin-bottom:8px" oninput="saveDropdowns()">'+
      '</div>'+
      '<div class="flabel" style="margin-top:4px">Extra Details (optional)</div>'+
      '<textarea class="finput" id="extraInput" rows="2" placeholder="e.g. funny, gift for mom, holiday, bathroom art..." oninput="saveDropdowns()"></textarea>'+
    '</div>'+
    '<button class="genbtn" id="genBtn" onclick="generateAll()">✨ Generate All Fields with AI</button>'+
    '<div id="resultsArea"></div>';
  restoreDropdowns(p);
  const desc = gf(p.t,'desc');
  if (desc) showResults(p.t, { desc, seoTitle: gf(p.t,'seo_title'), seoDesc: gf(p.t,'seo_desc'), tags: gf(p.t,'tags') });
}

function onCatChange() {
  const cat = document.getElementById('catSel').value;
  const wrap = document.getElementById('subcatWrap');
  const sel = document.getElementById('subcatSel');
  const custom = document.getElementById('customInput');
  saveDropdowns();
  if (!cat || cat === 'other' || !SUBCATS[cat] || !SUBCATS[cat].length) { wrap.style.display='none'; return; }
  wrap.style.display = 'block';
  custom.style.display = 'none';
  sel.innerHTML = '<option value="">-- Select --</option>';
  SUBCATS[cat].forEach(b => { const o = document.createElement('option'); o.value=b; o.textContent=b; sel.appendChild(o); });
}

function onSubcatChange() {
  const val = document.getElementById('subcatSel').value;
  const custom = document.getElementById('customInput');
  custom.style.display = val === 'Other' ? 'block' : 'none';
  if (val !== 'Other') custom.value = '';
  saveDropdowns();
}

function saveDropdowns() {
  if (!current) return;
  sf(current.t,'cat', document.getElementById('catSel')?.value||'');
  sf(current.t,'subcat', document.getElementById('subcatSel')?.value||'');
  sf(current.t,'custom', document.getElementById('customInput')?.value||'');
  sf(current.t,'extra', document.getElementById('extraInput')?.value||'');
}

function restoreDropdowns(p) {
  const cat = gf(p.t,'cat');
  const subcat = gf(p.t,'subcat');
  const custom = gf(p.t,'custom');
  const extra = gf(p.t,'extra');
  const catEl = document.getElementById('catSel');
  if (catEl && cat) { catEl.value = cat; onCatChange(); }
  const subcatEl = document.getElementById('subcatSel');
  if (subcatEl && subcat) { subcatEl.value = subcat; onSubcatChange(); }
  const customEl = document.getElementById('customInput');
  if (customEl && custom) { customEl.value = custom; }
  const extraEl = document.getElementById('extraInput');
  if (extraEl) extraEl.value = extra;
}

function getContext() {
  const cat = document.getElementById('catSel')?.value||'';
  const subcat = document.getElementById('subcatSel')?.value||'';
  const custom = document.getElementById('customInput')?.value.trim()||'';
  const extra = document.getElementById('extraInput')?.value.trim()||'';
  const breed = subcat === 'Other' ? custom : subcat;
  const parts = [];
  if (cat) parts.push('Category: '+cat);
  if (breed) parts.push('Breed/Type: '+breed);
  if (extra) parts.push('Additional notes: '+extra);
  return parts.join(' | ');
}

async function generateAll() {
  if (!current) return;
  const apiKey = document.getElementById('apiKey')?.value.trim() || localStorage.getItem('jamie_api_key')||'';
  if (!apiKey) { alert('Please paste your API key in the bar at the top.'); return; }
  const ctx = getContext();
  const btn = document.getElementById('genBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Generating...';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-4-5-20250929',
        max_tokens:1500,
        messages:[{role:'user', content:
          'You write Shopify product content for "Jamie Morath Art" — whimsical mixed media art prints of animals, pets, and flowers. Printed on premium paper with high-definition Epson archival inks, acid-free white matte included.\n\n'+
          'Product: "'+current.t+'"\n'+
          (ctx ? ctx+'\n' : '')+
          '\nWrite EXACTLY these 4 sections:\n\n'+
          'DESCRIPTION:\n'+
          'Write 4-5 warm, friendly paragraphs in plain text (no HTML tags). Charming opener about the artwork subject, print quality details, note about original signed/dated mixed media on watercolor paper, ships 1-3 business days from USA, copyright line.\n\n'+
          'SEO_TITLE:\nUnder 60 characters. Plain text.\n\n'+
          'SEO_DESCRIPTION:\nUnder 160 characters. Plain text. Mention subject, Jamie Morath Art, ships from USA.\n\n'+
          'TAGS:\n10-12 tags, comma-separated, lowercase with underscores.\n\nNo intro. No commentary. Just the 4 sections.'
        }]
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const text = (data.content||[]).map(b=>b.text||'').join('');
    function extract(t, start, end) {
      const si = t.indexOf(start);
      if (si===-1) return '';
      const after = t.slice(si+start.length).trim();
      if (!end) return after.trim();
      const ei = after.indexOf(end);
      return (ei===-1 ? after : after.slice(0,ei)).trim();
    }
    const result = {
      desc: extract(text,'DESCRIPTION:','SEO_TITLE:'),
      seoTitle: extract(text,'SEO_TITLE:','SEO_DESCRIPTION:'),
      seoDesc: extract(text,'SEO_DESCRIPTION:','TAGS:'),
      tags: extract(text,'TAGS:',null)
    };
    sf(current.t,'desc',result.desc);
    sf(current.t,'seo_title',result.seoTitle);
    sf(current.t,'seo_desc',result.seoDesc);
    sf(current.t,'tags',result.tags);
    showResults(current.t, result);
    updateStats(); renderList();
  } catch(e) {
    alert('Error: '+e.message);
  }
  btn.disabled=false; btn.innerHTML='✨ Generate All Fields with AI';
}

function showResults(title, r) {
  const area = document.getElementById('resultsArea');
  if (!area) return;
  area.innerHTML = '';
  [
    {key:'desc',      label:'📋 Description',      val:r.desc,     rows:8},
    {key:'seoTitle',  label:'🔍 SEO Title',         val:r.seoTitle, rows:2},
    {key:'seoDesc',   label:'🔍 SEO Description',   val:r.seoDesc,  rows:2},
    {key:'tags',      label:'🏷 Tags',              val:r.tags,     rows:2}
  ].forEach(function(f) {
    const card = document.createElement('div');
    card.className = 'card';
    const lbl = document.createElement('div');
    lbl.className = 'flabel';
    lbl.textContent = f.label;
    const ta = document.createElement('textarea');
    ta.className = 'rbox';
    ta.rows = f.rows;
    ta.id = 'f_'+f.key;
    ta.value = f.val || '';
    ta.oninput = function(){ onFieldEdit(f.key, this.value); };
    card.appendChild(lbl);
    card.appendChild(ta);
    area.appendChild(card);
  });
  const regen = document.createElement('button');
  regen.className = 'regenbtn';
  regen.textContent = '🔄 Regenerate';
  regen.onclick = generateAll;
  area.appendChild(regen);
  const tips = document.createElement('div');
  tips.className = 'tips';
  tips.innerHTML = '<strong style="color:#6D28D9">In Shopify:</strong><br>1. Import the CSV file to update all products at once<br>2. Go to Products → Import → Upload CSV → check <strong>Overwrite products</strong>';
  area.appendChild(tips);
}

function field(key, label, val, rows) { return ''; }

function onFieldEdit(key, val) {
  if (!current) return;
  const map = {desc:'desc',seoTitle:'seo_title',seoDesc:'seo_desc',tags:'tags'};
  if (map[key]) sf(current.t, map[key], val);
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function exportCSV() {
  const headers = ['Handle','Title','Body (HTML)','SEO Title','SEO Description','Tags','Option1 Name','Option1 Value','Variant Price'];
  const rows = [];
  PRODUCTS.forEach(p => {
    const desc = gf(p.t,'desc');
    const st = gf(p.t,'seo_title');
    const sd = gf(p.t,'seo_desc');
    let tg = gf(p.t,'tags')||'';
    const cat = gf(p.t,'cat')||'';
    const subcat = gf(p.t,'subcat')||'';
    const custom = gf(p.t,'custom')||'';
    const breed = subcat === 'Other' ? custom : subcat;
    [cat, breed].filter(Boolean).forEach(t => {
      const tag = t.toLowerCase().replace(/[\/\s]+/g,'_').replace(/[^a-z0-9_]/g,'_');
      if (tag && !tg.toLowerCase().includes(tag)) tg = tg ? tg+', '+tag : tag;
    });
    if (!desc && !st && !tg) return;
    const html = desc ? desc.split(/\n\n+/).filter(Boolean).map(d=>'<p>'+d.trim()+'</p>').join('\n') : '';
    const pvars = VARIANTS[p.h] || [{o:'Default Title', p:''}];
    const esc2 = v => '"'+(v||'').replace(/"/g,'""')+'"';
    // First row has all product data
    rows.push([p.h, p.t, html, st, sd, tg, 'Size', pvars[0].o, pvars[0].p].map(esc2).join(','));
    // Additional rows for each extra variant - only handle and variant data
    for (let i=1; i<pvars.length; i++) {
      rows.push([p.h,'','','','','','', pvars[i].o, pvars[i].p].map(esc2).join(','));
    }
  });
  if (!rows.length) { alert('Generate some descriptions first!'); return; }
  const csv = [headers.join(','),...rows].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = 'jamie_shopify_import.csv'; a.click();
  const btn = document.getElementById('exportBtn');
  btn.textContent='✓ Downloaded!'; btn.classList.add('saved');
  setTimeout(()=>{ btn.textContent='⬇ Export CSV'; btn.classList.remove('saved'); },3000);
}

function openLB(src) { document.getElementById('lb-img').src=src; document.getElementById('lightbox').classList.add('open'); }
function closeLB() { document.getElementById('lightbox').classList.remove('open'); }
document.addEventListener('keydown', e => { if(e.key==='Escape') closeLB(); });

function loadCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.split('\n');
    const headers = parseCSVRow(lines[0]);
    const hIdx = headers.indexOf('Handle');
    const tIdx = headers.indexOf('Title');
    const iIdx = headers.findIndex(h => h.trim() === 'Image Src');
    let updated = 0;
    // Build a map of handle -> image from CSV
    const imgMap = {};
    const titleMap = {};
    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      const cols = parseCSVRow(lines[i]);
      const handle = cols[hIdx]?.trim();
      const title = cols[tIdx]?.trim();
      const img = iIdx >= 0 ? cols[iIdx]?.trim() : '';
      if (handle) {
        if (img && !imgMap[handle]) imgMap[handle] = img;
        if (title && !titleMap[handle]) titleMap[handle] = title;
      }
    }
    // Update PRODUCTS array
    PRODUCTS.forEach(p => {
      if (imgMap[p.h]) { p.i = imgMap[p.h]; updated++; }
    });
    const btn = document.getElementById('exportBtn');
    if (updated > 0) {
      alert('✓ CSV loaded! Found images for ' + updated + ' products. Images will now show in the list.');
    } else {
      alert('CSV loaded but no images found. Make sure this is the Shopify products export CSV (not inventory).');
    }
    renderList();
    if (current) openProduct(current);
  };
  reader.readAsText(file);
}

function parseCSVRow(row) {
  const cols = [];
  let cur = '', inQ = false;
  for (let i = 0; i < row.length; i++) {
    const c = row[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { cols.push(cur); cur = ''; }
    else { cur += c; }
  }
  cols.push(cur);
  return cols;
}

function saveKey(val) {
  val = val.trim();
  try { localStorage.setItem('jamie_api_key', val); } catch {}
  const s = document.getElementById('apiStatus');
  if (val.startsWith('sk-ant-')) { 
    s.textContent='✓ Key saved!'; 
    s.style.color='#4ade80'; 
    s.style.fontWeight='800'; 
    s.style.fontSize='13px';
    document.querySelector('.apibar').style.background = '#14532d';
  }
  else if (val) { 
    s.textContent='⚠ Key invalid - should start with sk-ant-'; 
    s.style.color='#FCD34D'; 
    s.style.fontWeight='700';
    document.querySelector('.apibar').style.background = '#78350f';
  }
  else { 
    s.textContent=''; 
    document.querySelector('.apibar').style.background = '#2E1065';
  }
}

    if (k) { document.getElementById('apiKey').value=k; saveKey(k); }
